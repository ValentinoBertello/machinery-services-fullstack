# ------ Configuración de la Base de Datos ------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/machinery_db}
spring.datasource.username=${DB_USER:machinery_user}
spring.datasource.password=${DB_PASSWORD:machinery_pass}
# Sin esto, EXTRACT/YEAR/MONTH usan el TimeZone por defecto del servidor (normalmente UTC).
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Argentina/Buenos_Aires'
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.data.web.pageable.max-page-size=100

jwt.secretKey=${JWT_SECRET:dev-secret-change-in-prod-must-be-32-chars-min}
app.cors.allowed-origins=http://localhost:5173